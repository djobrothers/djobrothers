# Render Blueprint Specification
# Place at project root for Render auto-detection

services:
  - type: web
    name: djo-backend-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
