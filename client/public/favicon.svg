<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Stem & Outer D Gradient -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Cyber Shield Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#dropShadow)" />

  <!-- Radar Grid Background Overlay -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.08" />
  <line x1="256" y1="76" x2="256" y2="436" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="4 4" />
  <line x1="76" y1="256" x2="436" y2="256" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="4 4" />

  <!-- High-Tech "D" Symbol Group -->
  <g filter="url(#glow)">
    <!-- Vertical Left Bar / Stem of 'D' -->
    <path d="M 136 144 Q 136 128 152 128 L 192 128 Q 200 128 200 136 L 200 376 Q 200 384 192 384 L 152 384 Q 136 384 136 368 Z" fill="url(#dGrad)" />

    <!-- Outer Loop of 'D' -->
    <path d="M 192 128 C 340 128 408 176 408 256 C 408 336 340 384 192 384 L 192 328 C 298 328 344 296 344 256 C 344 216 298 184 192 184 Z" fill="url(#dGrad)" />

    <!-- Sleek Diagonal Cyber Cut / Accent Beam -->
    <path d="M 192 184 L 270 184 C 315 184 344 214 344 256 L 316 256 C 316 228 296 208 262 208 L 192 208 Z" fill="url(#coreGrad)" opacity="0.9" />

    <!-- Central Defense Shield / Core emblem inside the 'D' counter -->
    <path d="M 256 216 L 284 230 C 284 260 274 278 256 292 C 238 278 228 260 228 230 Z" fill="none" stroke="url(#coreGrad)" stroke-width="6" stroke-linejoin="round" />
    <path d="M 256 226 L 276 236 C 276 258 268 270 256 280 C 244 270 236 258 236 236 Z" fill="none" stroke="url(#coreGrad)" stroke-width="3" stroke-linejoin="round" opacity="0.8" />
    <!-- Diagonal Spanner Overlay (Top-Left to Bottom-Right) -->
    <line x1="210" y1="210" x2="300" y2="300" stroke="#00f0ff" stroke-width="12" stroke-linecap="round" />
    <line x1="218" y1="218" x2="292" y2="292" stroke="#080d1a" stroke-width="4" stroke-linecap="round" />
    <circle cx="304" cy="304" r="14" fill="#080d1a" stroke="#00f0ff" stroke-width="6" />
    <circle cx="204" cy="204" r="12" fill="#00f0ff" />
  </g>
</svg>
